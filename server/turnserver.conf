# Coturn Configuration for Spectre Orbit WebRTC Relay (RFC 5766)
# Deploy on a public VPS with open UDP/TCP ports 3478, 5349, and 49152-65535

listening-port=3478
tls-listening-port=5349

# IP address of the server
# listening-ip=0.0.0.0
# external-ip=YOUR_PUBLIC_IP

realm=turn.yourdomain.com
server-name=spectre-turn

# Ephemeral secret authentication (matches server/index.mjs TURN_SECRET)
use-auth-secret
static-auth-secret=your_super_secret_coturn_token_here

# SSL Certificates (Let's Encrypt)
# cert=/etc/letsencrypt/live/turn.yourdomain.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.yourdomain.com/privkey.pem

# Security restrictions
no-cli
no-tcp-relay
stale-nonce=600
max-allocate-lifetime=3600

# Relay port range
min-port=49152
max-port=65535

# Logging
syslog
verbose
