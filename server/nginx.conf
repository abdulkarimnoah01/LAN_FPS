# Nginx Reverse Proxy Configuration for Spectre Orbit Online
# HTTPS + WSS WebSocket Proxy + Static Game Hosting

upstream signaling_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name play.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name play.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/play.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Game Static Files
    location / {
        root /var/www/spectre-orbit/dist/online;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Matchmaking & Signaling WebSocket endpoint
    location /ws {
        proxy_pass http://signaling_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST Health and ICE configuration endpoints
    location ~ ^/(health|ice|rooms) {
        proxy_pass http://signaling_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
